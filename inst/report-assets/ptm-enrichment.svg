<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:auto;max-width:1600px;margin:0 auto;">
  <title id="title">{{ANALYSIS}} enrichment report</title>
  <desc id="desc">The {{ANALYSIS}} {{RANKING}} enters PTM-SEA, Kinase GSEA, and MEA. Their stored JSON produces plots and tested-term tables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1575b6"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #17324d; }
      .input-label { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 24px Arial, sans-serif; fill: #17324d; }
      .body { font: 20px Arial, sans-serif; fill: #29485f; }
      .small { font: 18px Arial, sans-serif; fill: #355b73; }
      .input { fill: #e7f4fb; stroke: #1575b6; stroke-width: 4; }
      .method { fill: #f2f8fc; stroke: #1575b6; stroke-width: 3; }
      .output { fill: #eef7ef; stroke: #2f855a; stroke-width: 3; }
      .arrow { stroke: #1575b6; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="800" y="42" text-anchor="middle" class="title">{{ANALYSIS}} ranking → three enrichment methods</text>

  <rect x="70" y="155" width="360" height="120" rx="20" class="input"/>
  <text x="250" y="203" text-anchor="middle" class="input-label">{{ANALYSIS}}</text>
  <text x="250" y="242" text-anchor="middle" class="body">{{RANKING}}</text>

  <path d="M 430 215 C 515 215, 535 110, 625 110" class="arrow"/>
  <path d="M 430 215 L 625 210" class="arrow"/>
  <path d="M 430 215 C 515 215, 535 310, 625 310" class="arrow"/>

  <rect x="655" y="65" width="350" height="90" rx="18" class="method"/>
  <text x="830" y="104" text-anchor="middle" class="label">PTM-SEA</text>
  <text x="830" y="136" text-anchor="middle" class="body">curated PTM signatures</text>

  <rect x="655" y="165" width="350" height="90" rx="18" class="method"/>
  <text x="830" y="204" text-anchor="middle" class="label">Kinase GSEA</text>
  <text x="830" y="236" text-anchor="middle" class="body">predicted kinase sets</text>

  <rect x="655" y="265" width="350" height="90" rx="18" class="method"/>
  <text x="830" y="304" text-anchor="middle" class="label">MEA</text>
  <text x="830" y="336" text-anchor="middle" class="body">native motif enrichment</text>

  <path d="M 1005 110 C 1090 110, 1105 185, 1190 190" class="arrow"/>
  <path d="M 1005 210 L 1190 240" class="arrow"/>
  <path d="M 1005 310 C 1090 310, 1105 295, 1190 290" class="arrow"/>

  <rect x="1220" y="135" width="330" height="210" rx="22" class="output"/>
  <text x="1385" y="174" text-anchor="middle" class="label">Report views</text>
  <text x="1245" y="214" class="small">• dot, heatmap, volcano</text>
  <text x="1245" y="249" class="small">• rank and network views</text>
  <text x="1245" y="284" class="small">• tested-term tables</text>
  <text x="1385" y="321" text-anchor="middle" class="small">validated JSON in MuData</text>
</svg>
